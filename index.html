<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="회사 빌딩과 그 안의 사무실을 3D로 부수는 스트레스 해소 게임">
<title>SMASH OFFICE — 회사 부수기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --panel: rgba(255, 255, 255, .86);
  --fg: #16171b;
  --muted: #5f636c;
  --line: rgba(22, 23, 27, .12);
  --accent: #ff3d7f;
  --accent-soft: #ffe1ec;
  --on-accent: #fff;
  --chip-bg: #16171b;
  --chip-fg: #fff;
  --shadow: 0 6px 24px rgba(20, 20, 30, .16);
}
body.night {
  --panel: rgba(16, 18, 28, .84);
  --fg: #eef0f6;
  --muted: #a2a7b6;
  --line: rgba(255, 255, 255, .12);
  --accent-soft: rgba(255, 61, 127, .2);
  --chip-bg: #eef0f6;
  --chip-fg: #16171b;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: #cfdbe6; color: var(--fg);
  font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
body.night { background: #070b18; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#left { position: fixed; left: 16px; top: 16px; width: 240px; display: flex; flex-direction: column; gap: 10px; }
#brand { padding: 14px 16px 12px; }
#brand h1 { margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; letter-spacing: .5px; }
#brand h1 b { color: var(--accent); font-weight: 400; }
#brand .sub { margin: 7px 0 0; font-size: 13px; font-weight: 700; }
#brand .note { margin: 6px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
#brand .note a { color: inherit; }
#dock { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tool {
  appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
  border-radius: 10px; padding: 8px 6px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; font: inherit; position: relative; transition: background .15s, transform .1s;
}
.tool:hover { background: var(--accent-soft); }
.tool:active { transform: scale(.96); }
.tool.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tool .ic { font-size: 22px; line-height: 1.15; }
.tool .nm { font-size: 12px; font-weight: 700; }
.tool kbd { position: absolute; top: 4px; right: 6px; font: 500 10px/1 ui-monospace, Menlo, monospace; opacity: .55; }
#toolInfo { padding: 10px 14px; font-size: 12px; color: var(--muted); line-height: 1.5; }
#quakeBox { margin-top: 8px; color: var(--fg); }
#quakeBox[hidden] { display: none; }
#quakeBox .row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 13px; }
#quakeBox .row small { font-weight: 500; color: var(--muted); font-size: 11px; }
#quakeBox input { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
#stats { position: fixed; right: 16px; top: 16px; padding: 14px 16px; min-width: 230px; text-align: right; }
#stats .lbl { font-size: 11px; color: var(--muted); font-weight: 700; }
#dmg { font-family: 'Black Han Sans', sans-serif; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--accent); }
#dmgKor { font-size: 12px; color: var(--muted); min-height: 17px; }
#rank { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); font-size: 12px; font-weight: 700; }
#stats dl { display: grid; grid-template-columns: auto auto; gap: 3px 14px; margin: 10px 0 0; font-size: 12px; }
#stats dt { color: var(--muted); text-align: left; }
#stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
#corner { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 300px); }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px;
  padding: 9px 14px; font: 700 13px 'Noto Sans KR', sans-serif; cursor: pointer; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.hq { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#hint {
  position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); padding: 10px 16px; font-size: 13px;
  text-align: center; transition: opacity .6s; pointer-events: none; max-width: calc(100vw - 32px); line-height: 1.5;
}
#hint.gone { opacity: 0; }
#toasts { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 5; }
.toast { padding: 8px 14px; font-size: 13px; font-weight: 700; white-space: nowrap; animation: tin .25s ease-out, tout .4s ease-in 3.2s forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes tout { to { opacity: 0; transform: translateY(-8px); } }
#tip { position: fixed; left: 0; top: 0; padding: 5px 9px; font-size: 12px; pointer-events: none; border-radius: 8px; white-space: nowrap; display: none; z-index: 4; }
#pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pop { position: absolute; left: 0; top: 0; will-change: transform; }
.pop span {
  display: block; transform: translate(-50%, -100%); font: 700 13px 'Noto Sans KR', sans-serif; color: #fff;
  background: rgba(255, 61, 127, .92); padding: 2px 9px; border-radius: 999px; white-space: nowrap; animation: popup 1.4s ease-out forwards;
}
.pop.big span { font-size: 15px; background: rgba(22, 23, 27, .9); }
@keyframes popup { 0% { opacity: 0; margin-top: 8px; } 12% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
#draw { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#dim, #flash { position: fixed; inset: 0; opacity: 0; pointer-events: none; }
#dim { background: #07040c; }
#flash { background: #fff; }
#comboPop {
  position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); font-family: 'Black Han Sans', sans-serif; font-size: 46px;
  color: var(--accent); text-shadow: 0 2px 0 #fff, 0 8px 22px rgba(0, 0, 0, .25); pointer-events: none; opacity: 0; white-space: nowrap;
}
#comboPop.go { animation: combo .9s ease-out; }
#fatal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px 20px; max-width: calc(100vw - 32px); font-size: 14px; font-weight: 700; line-height: 1.5; z-index: 10; }
#fatal[hidden] { display: none; }
#noscript { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); padding: 16px 20px; font-size: 15px; font-weight: 700; line-height: 1.6; z-index: 10; }
@keyframes combo { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }
@media (max-width: 720px) {
  #left { left: 10px; top: 10px; width: auto; }
  #brand { padding: 9px 12px; }
  #brand h1 { font-size: 22px; }
  #brand .sub { font-size: 11px; margin-top: 4px; }
  #brand .note { display: none; }
  #dock { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); grid-template-columns: repeat(6, 1fr); padding: 6px; gap: 4px; }
  .tool { padding: 6px 2px; }
  .tool .ic { font-size: 19px; }
  .tool .nm { font-size: 10.5px; }
  .tool kbd { display: none; }
  #toolInfo { position: fixed; left: 10px; right: 10px; bottom: calc(84px + env(safe-area-inset-bottom)); padding: 8px 12px; }
  #toolInfo.noq { display: none; }
  #toolDesc { display: none; }
  #quakeBox { margin-top: 0; }
  #stats { right: 10px; top: 10px; min-width: 0; padding: 9px 12px; }
  #dmg { font-size: 19px; }
  #dmgKor, #stats dl { display: none; }
  #rank { font-size: 11px; margin-top: 4px; }
  #corner { right: 10px; bottom: auto; top: 96px; flex-direction: column; align-items: flex-end; max-width: none; }
  .btn { padding: 7px 11px; font-size: 12px; }
  #hint { bottom: calc(150px + env(safe-area-inset-bottom)); font-size: 12px; }
  #comboPop { font-size: 34px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="draw"><polyline points="" fill="none" stroke="#ff3d7f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"/></svg>
<div id="pops"></div>
<div id="dim"></div>
<div id="flash"></div>
<div id="comboPop"></div>

<div id="left">
  <header id="brand" class="card">
    <h1>SMASH <b>OFFICE</b></h1>
    <p class="sub">회사 빌딩 · 사무실 부수기</p>
    <p class="note">스트레스 해소용 게임입니다. 등장하는 회사와 건물은 가상입니다.<br>
      <a href="https://hong-iron.github.io/SMASH/" target="_blank" rel="noopener">SMASH 대학교</a>에서 영감을 받아 새로 만들었습니다.</p>
  </header>
  <nav id="dock" class="card" aria-label="부수기 도구"></nav>
  <div id="toolInfo" class="card noq">
    <div id="toolDesc"></div>
    <div id="quakeBox" hidden>
      <div class="row"><span>규모 <span id="magV">7.0</span></span><small id="magDesc"></small></div>
      <input id="mag" type="range" min="4" max="10" step="0.1" value="7" aria-label="지진 규모">
    </div>
  </div>
</div>

<aside id="stats" class="card">
  <div class="lbl">피해 청구액</div>
  <div id="dmg">₩0</div>
  <div id="dmgKor"></div>
  <div id="rank">평화로운 오전 업무</div>
  <dl>
    <dt>부순 물건</dt><dd id="objs">0개</dd>
    <dt>파괴율</dt><dd id="pct">0%</dd>
    <dt>지상 추락</dt><dd id="fell">0개</dd>
  </dl>
</aside>

<div id="corner">
  <button class="btn hq" id="btnHq" title="A">📍 우리 회사</button>
  <button class="btn" id="btnHome" title="H">🏙️ 전체</button>
  <button class="btn" id="btnNight" title="N">🌙 야근 모드</button>
  <button class="btn" id="btnReset" title="R">↺ 전부 복구</button>
  <button class="btn" id="btnSound" title="M">🔊 소리</button>
</div>
<div id="hint" class="card"></div>
<div id="toasts"></div>
<div id="tip" class="card"></div>

<noscript><div class="card" id="noscript">이 화면에서는 게임이 실행되지 않습니다. 파일 미리보기는 자바스크립트를 실행하지 않으니 Safari나 Chrome에서 주소로 열어 주세요.</div></noscript>
<div id="fatal" class="card" hidden></div>
<script>
// 실행 중 오류가 나면 빈 화면 대신 원인을 띄운다
function showFatal(msg) {
  const el = document.getElementById('fatal');
  el.hidden = false;
  el.textContent = '게임을 시작하지 못했습니다. ' + msg;
}
addEventListener('error', e => showFatal(e.message || '스크립트를 불러오지 못했습니다'));
addEventListener('unhandledrejection', e => showFatal(String(e.reason)));
</script>
<!-- three.js r160 + OrbitControls (MIT). 외부 CDN 없이 로컬 파일만으로 돌도록 같은 폴더에 묶어 둔다 -->
<script src="three.bundle.js" onerror="showFatal('같은 폴더에 three.bundle.js 가 있어야 합니다.')"></script>
<script type="module">
const { THREE, OrbitControls } = window;

const $ = s => document.querySelector(s);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const V3 = THREE.Vector3;
const _v = new V3(), _v2 = new V3(), _p0 = new V3(), _s = new V3(), _up = new V3(0, 1, 0);
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _m = new THREE.Matrix4(), _e = new THREE.Euler();

// 타워: 층마다 바닥 슬래브 타일·기둥·외벽 패널이 각각 부서지는 몸체다. 위로 갈수록 좁아진다
const FH = 3.6, NF = 26, HQ_K = 8;
const plate = k => (k <= 9 ? [38, 28] : [38 - (k - 9) * .55, 28 - (k - 9) * .4]);
const HQ_Y = HQ_K * FH;
const G = 15;
const MAXI = 20000, SOFTCAP = 17000;
const DENS = { wood: 650, plastic: 950, metal: 2700, glass: 2500, fabric: 250, stone: 2300, concrete: 2400, ceramic: 1800, plant: 300, elec: 1300, paper: 700, rock: 3000 };
const CHARC = new THREE.Color(0x15110e);

// ---------- 렌더러 · 카메라 ----------
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.3, 6000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 3;
controls.maxDistance = 480;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
const portrait = () => innerWidth / innerHeight < 1;
const VIEWS = {
  home: () => { const f = portrait() ? 1.8 : 1; return [new V3(112 * f, 88 * f, 148 * f), new V3(0, 52, 0)]; },
  hq: () => { const f = portrait() ? 1.7 : 1; return [new V3(34 * f, HQ_Y + 14 * f, 44 * f), new V3(0, HQ_Y + 1.6, 0)]; },
};
{ const [p, t] = VIEWS.home(); camera.position.copy(p); controls.target.copy(t); controls.update(); }

// ---------- 바깥 풍경 ----------
function canvasTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

function skyTexture(night) {
  const W = 4096, H = 1024, hz = 952;
  const [c, g] = makeCanvas(W, H);
  const sg = g.createLinearGradient(0, 0, 0, hz);
  if (night) { sg.addColorStop(0, '#03050d'); sg.addColorStop(.6, '#0b1532'); sg.addColorStop(1, '#2a3354'); }
  else { sg.addColorStop(0, '#4f8fd6'); sg.addColorStop(.55, '#9cc6ec'); sg.addColorStop(1, '#e4eef5'); }
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  if (night) {
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(255,255,255,${rand(.2, .9)})`; const r = rand(.6, 1.8); g.fillRect(rand(0, W), rand(0, hz * .85), r, r); }
    g.fillStyle = '#f4f1e3'; g.beginPath(); g.arc(3100, 220, 24, 0, 7); g.fill();
  } else {
    for (let i = 0; i < 55; i++) {
      const x = rand(0, W), y = rand(80, hz - 160), w = rand(120, 420);
      g.fillStyle = `rgba(255,255,255,${rand(.25, .5)})`;
      for (let k = 0; k < 6; k++) { g.beginPath(); g.ellipse(x + rand(-w / 2, w / 2), y + rand(-12, 12), rand(w * .2, w * .45), rand(10, 26), 0, 0, 7); g.fill(); }
    }
  }
  const ridge = (base, amp, col, seed) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const y = base - amp * (.5 + .5 * Math.sin(x * .0021 + seed)) * (.6 + .4 * Math.sin(x * .0067 + seed * 2)) - amp * .25 * Math.sin(x * .019 + seed * 3);
      g.lineTo(x, y);
    }
    g.lineTo(W, H); g.closePath(); g.fill();
  };
  ridge(hz - 20, 70, night ? '#141c36' : '#a3b8ca', 1.3);
  ridge(hz - 8, 40, night ? '#10172c' : '#93a8ba', 4.1);
  for (let i = 0; i < 1800; i++) {
    const x = rand(0, W), w = rand(4, 18), h = Math.pow(Math.random(), 3) * 46 + 3, y = hz - h + rand(0, 10);
    g.fillStyle = night ? `hsl(225,20%,${rand(8, 18)}%)` : `hsl(${rand(200, 230)},${rand(6, 14)}%,${rand(60, 78)}%)`;
    g.fillRect(x, y, w, H - y);
    if (night && Math.random() < .7) {
      g.fillStyle = `rgba(255,${rand(190, 230) | 0},120,${rand(.4, .9)})`;
      for (let k = 0; k < w * h / 12; k++) g.fillRect(x + rand(0, w), y + rand(0, h), 1, 1);
    }
  }
  const hg = g.createLinearGradient(0, hz - 30, 0, H);
  hg.addColorStop(0, night ? 'rgba(26,33,64,0)' : 'rgba(223,232,239,0)');
  hg.addColorStop(1, night ? '#1a2140' : '#dfe8ef');
  g.fillStyle = hg; g.fillRect(0, hz - 30, W, H - hz + 30);
  return canvasTex(c);
}

function groundTexture(night) {
  const S = 1024, step = 128;
  const [c, g] = makeCanvas(S, S);
  g.fillStyle = night ? '#0b0f1c' : '#9aa0a6'; g.fillRect(0, 0, S, S);
  for (let bx = 0; bx < S; bx += step) for (let by = 0; by < S; by += step) {
    const x0 = bx + 14, y0 = by + 14, w = step - 28;
    if (!night && Math.random() < .12) { g.fillStyle = '#86a072'; g.fillRect(x0, y0, w, w); continue; }
    for (let k = 0; k < 6; k++) {
      const bw = rand(14, 50), bh = rand(14, 50), x = x0 + rand(0, w - bw), y = y0 + rand(0, w - bh);
      g.fillStyle = night ? `hsl(225,18%,${rand(8, 14)}%)` : `hsl(${rand(20, 220)},${rand(4, 12)}%,${rand(62, 82)}%)`;
      g.fillRect(x, y, bw, bh);
      if (night) { g.fillStyle = `rgba(255,210,140,${rand(.3, .8)})`; for (let n = 0; n < bw * bh / 40; n++) g.fillRect(x + rand(0, bw), y + rand(0, bh), 1.5, 1.5); }
    }
  }
  g.fillStyle = night ? '#1b1d24' : '#7a7f86';
  for (let i = 0; i <= S; i += step) { g.fillRect(i - 6, 0, 12, S); g.fillRect(0, i - 6, S, 12); }
  if (night) {
    g.fillStyle = 'rgba(255,170,80,.6)';
    for (let i = 0; i <= S; i += step) for (let k = 0; k < S; k += 10) { g.fillRect(i - 1, k, 2, 4); g.fillRect(k, i - 1, 4, 2); }
  }
  const t = canvasTex(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(16, 16);
  return t;
}

function plazaTexture() {
  const S = 512;
  const [c, g] = makeCanvas(S, S);
  g.fillStyle = '#d9d5ce'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    g.fillStyle = `hsl(35,${rand(5, 10)}%,${rand(78, 86)}%)`;
    g.fillRect(i * 64 + 1, j * 64 + 1, 62, 62);
  }
  const t = canvasTex(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(24, 24);
  return t;
}

const TEX = { day: {}, night: {} };
const skyMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false });
const sky = new THREE.Mesh(new THREE.CylinderGeometry(1700, 1700, 1800, 96, 1, true), skyMat);
sky.position.y = 900;
scene.add(sky);
const groundMat = new THREE.MeshStandardMaterial({ roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4200, 4200), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.y = -.4; ground.receiveShadow = true;
scene.add(ground);
const plaza = new THREE.Mesh(new THREE.PlaneGeometry(190, 190), new THREE.MeshStandardMaterial({ map: plazaTexture(), roughness: .9 }));
plaza.rotation.x = -Math.PI / 2; plaza.position.y = 0; plaza.receiveShadow = true;

function populate(k) {
  const F = floors[k];
  if (!F || F.populated) return;
  F.populated = true;
  const pc = curFloor, pb = baseY;
  curFloor = k; baseY = F.y;
  const free = (x, z, r) => {
    const t = tileAt(k, x, z);
    return t && t.alive && !t.dyn && Math.abs(x) < F.W / 2 - r - .4 && Math.abs(z) < F.D / 2 - r - .4
      && !F.cols.some(c => Math.abs(c.pos.x - x) < r + .45 && Math.abs(c.pos.z - z) < r + .45);
  };
  for (let x = F.x0 + 3; x < F.x0 + F.W - 2; x += 6) for (let z = F.z0 + 3; z < F.z0 + F.D - 2; z += 6) {
    const t = tileAt(k + 1, x, z);
    if (t && t.alive && !t.dyn) addB(obj('천장 조명', 250000), x, 3.08, z, 1.2, .04, .6, 0xfff4e0, { b: 'e', stab: .35, free: true, on: [t] });
  }
  const kind = k === 0 ? 'lobby' : pick(['office', 'office', 'office', 'meeting', 'lounge']);
  if (kind === 'office') {
    for (let z = F.z0 + 3.2; z < F.z0 + F.D - 3; z += 5.2) for (let x = F.x0 + 3; x < F.x0 + F.W - 3; x += 4.4) {
      if (Math.random() < .82 && free(x, z, 1.6)) { simpleDesk(x, z - .37, 0); simpleDesk(x, z + .37, Math.PI); }
    }
  } else if (kind === 'meeting') {
    for (let z = F.z0 + 4; z < F.z0 + F.D - 3; z += 7) for (let x = F.x0 + 4; x < F.x0 + F.W - 3; x += 6.5) {
      if (free(x, z, 2.3)) { meetTable(x, z); if (Math.random() < .5 && free(x + 2.4, z, .5)) whiteboard(x + 2.4, z, Math.PI / 2); }
    }
  } else if (kind === 'lounge') {
    for (let i = 0; i < 26; i++) {
      const x = rand(F.x0 + 2, F.x0 + F.W - 2), z = rand(F.z0 + 2, F.z0 + F.D - 2);
      if (!free(x, z, 1.4)) continue;
      const r = Math.random();
      if (r < .3) cafeTable(x, z);
      else if (r < .5) sofa(x, z, pick([0, Math.PI / 2, Math.PI]), 2.2, pick([0x59616d, 0xe8e2da, C.pinkSoft]));
      else if (r < .75) beanbag(x, z);
      else plant(x, z, rand(.8, 1.2));
    }
  } else {
    const R = obj('로비 안내 데스크', 6000000);
    const front = addB(R, 0, 0, 2.2, 6, 1.05, .1, 0xfafafa, { stab: .55 });
    addB(R, 0, 1.05, 2.5, 6.2, .06, .8, 0x2b2d33, { mat: 'stone', stab: .55, on: [front] });
    for (const x of [-12, 12]) for (const z of [-6, 6]) if (free(x, z, 1.4)) sofa(x, z, z > 0 ? 0 : Math.PI, 2.4, 0x3f454f);
    for (let i = -3; i <= 3; i++) if (free(i * 1.6, -7, .4)) addB(obj('보안 게이트', 4500000), i * 1.6, 0, -7, .18, 1.0, 1.2, 0xc9ccd1, { mat: 'metal', stab: .5 });
  }
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const x = sx * (F.W / 2 - 1.5), z = sz * (F.D / 2 - 1.5);
    if (free(x, z, .4)) plant(x, z, rand(.8, 1.1));
  }
  curFloor = pc; baseY = pb;
}
function populateNear(c, R) {
  for (let k = 0; k < NF; k++) {
    const F = floors[k];
    if (F.populated || c.y + R < F.y - .5 || c.y - R > F.y + FH) continue;
    if (Math.abs(c.x) > F.W / 2 + R || Math.abs(c.z) > F.D / 2 + R) continue;
    if (totalCount() > SOFTCAP - 4000) return;
    populate(k);
  }
}

const tasks = [];
// 슬래브·기둥은 폭심 가까이(반경의 안쪽 45%)에서만 부서진다. 가장자리에 걸렸다고 통째로 무너지지 않게
const STRUCT_F = .55;
const isStructure = b => b.isTile || b.isCol;
const toolScale = c => clamp(camera.position.distanceTo(c) / 70, 1, 1.4);
function explode(c, R, P, { up = .45, fineR = .55, fracR = .8 } = {}) {
  for (const [b, d] of near(c, R)) {
    if (!b.alive) continue;
    const f = 1 - d / R;
    if (isStructure(b) && f < STRUCT_F) continue;
    let ps = [b];
    if (b.glass || (f > 1 - fracR && maxHalf(b) > .14)) ps = fracture(b, f > 1 - fineR);
    for (const p of ps) {
      _v.subVectors(p.pos, c); _v.y += up * R * rand(.5, 1);
      if (_v.lengthSq() < 1e-6) _v.set(0, 1, 0);
      _v.normalize();
      const sp = P * Math.pow(f, 1.3) * massFactor(p) * rand(.7, 1.2);
      release(p, _v.x * sp, _v.y * sp, _v.z * sp, 4 + sp * .8);
      if (f > .6) char(p, (f - .6) * 1.2);
    }
  }
}
function bomb(c) {
  const s = toolScale(c), R = 2.8 * s;
  populateNear(c, R + 1);
  explode(c, R, 15);
  blastFx(c, R);
  addShake(.35); sfx.boom(s);
  addDecal(c.x, c.y, c.z, R * .7, 'scorch');
}

function makeHammer(F, s) {
  const g = new THREE.Group(), L = 3.4 * s;
  const wood = new THREE.MeshStandardMaterial({ color: 0x8a5a33, roughness: .6, transparent: true });
  const steel = new THREE.MeshStandardMaterial({ color: 0x3a3d44, roughness: .35, metalness: .7, transparent: true });
  const band = new THREE.MeshStandardMaterial({ color: C.pink, roughness: .4, transparent: true });
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(.09 * s, .12 * s, L, 12), wood);
  handle.position.y = L / 2;
  const head = new THREE.Group();
  head.position.y = L;
  head.quaternion.setFromUnitVectors(new V3(0, 0, 1), F);
  head.add(new THREE.Mesh(new THREE.BoxGeometry(.75 * s, .75 * s, 1.3 * s), steel), new THREE.Mesh(new THREE.BoxGeometry(.78 * s, .78 * s, .22 * s), band));
  g.add(handle, head);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { g, L, mats: [wood, steel, band] };
}
function hammer(c) {
  const s = toolScale(c);
  const F = _v.subVectors(c, camera.position).setY(0);
  if (F.lengthSq() < 1e-6) F.set(0, 0, -1);
  F.normalize();
  const fwd = F.clone(), H = makeHammer(fwd, s);
  const pivot = new V3(c.x - fwd.x * H.L, c.y + .35 * s, c.z - fwd.z * H.L);
  const axis = new V3().crossVectors(_up, fwd).normalize();
  H.g.position.copy(pivot); scene.add(H.g);
  sfx.swoosh();
  let t = 0, hit = false;
  const T = .26;
  tasks.push({
    update(rdt, dt) {
      t += dt;
      const th = t < T ? -.5 + (Math.PI / 2 + .5) * (t / T) * (t / T) : Math.PI / 2;
      if (t >= T && !hit) { hit = true; hammerHit(c, fwd, s); }
      H.g.quaternion.setFromAxisAngle(axis, th);
      if (t > T + .35) {
        const k = Math.min(1, (t - T - .35) / .3);
        H.g.position.y = pivot.y + k * 3 * s;
        for (const m of H.mats) m.opacity = 1 - k;
        if (k >= 1) { this.kill(); return false; }
      }
      return true;
    },
    kill() { scene.remove(H.g); },
  });
}
function hammerHit(c, F, s) {
  const R = 2.4 * s;
  populateNear(c, R);
  for (const [b, d] of near(c, R)) {
    if (!b.alive) continue;
    const f = 1 - d / R;
    if (isStructure(b) && f < STRUCT_F) continue;
    const ps = b.glass || (d < 1 * s && maxHalf(b) > .09) ? fracture(b, true) : [b];
    for (const p of ps) {
      _v.subVectors(p.pos, c).setY(0);
      const hl = _v.length() || 1; _v.divideScalar(hl);
      const sp = 12 * Math.pow(f, 1.2) * massFactor(p) * rand(.7, 1.2);
      const below = p.pos.y < c.y + .3;
      release(p, (_v.x * .75 + F.x * .6) * sp, below ? sp * .35 : -sp * .6, (_v.z * .75 + F.z * .6) * sp, 3 + sp * .5);
    }
  }
  addShake(.45); sfx.thud(1); sfx.boom(.35 * s);
  shock(c, 3 * s, .4);
  for (let i = 0; i < 40; i++) {
    const a = rand(0, 6.28);
    smoke.emit(c.x, c.y + .1, c.z, Math.cos(a) * rand(2, 5) * s, rand(.3, 1.5), Math.sin(a) * rand(2, 5) * s, rand(.8, 1.6), .4 * s, 1.6 * s, [.6, .57, .53], [.72, .7, .66], .5, -.2, 2.5);
  }
  addDecal(c.x, c.y, c.z, 1.6 * s, 'crack');
}

function burn(p) {
  populateNear(p, .8);
  for (const [b] of near(p, .55)) {
    if (!b.alive) continue;
    const ps = maxHalf(b) > .07 ? fracture(b, true) : [b];
    for (const q of ps) {
      if (boxDist(q, p) < .4) { char(q, .8); release(q, rand(-1.5, 1.5), rand(2, 5), rand(-1.5, 1.5), 7); }
      else release(q, rand(-.3, .3), 0, rand(-.3, .3), 1);
    }

function startQuake(c) {

function updateQuake(dt) {

  }
}
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return a; return (c - 0xAC00) % 28 ? a : b; };
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast card'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3700);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
}
const pops = [];
function pop(p, text, big) {
  if (pops.length > 9) return;
  const el = document.createElement('div');
  el.className = 'pop' + (big ? ' big' : '');
  el.innerHTML = '<span></span>'; el.firstChild.textContent = text;
  $('#pops').appendChild(el);
  pops.push({ el, p: p.clone(), t: 0 });
}
const won = n => '₩' + Math.round(n).toLocaleString('ko-KR');
function flushHits() {
  if (!pendingHits.length) return;
  pendingHits.sort((a, b) => b.o.price - a.o.price);
  for (const h of pendingHits.slice(0, 3)) pop(h.p.clone().setY(h.p.y + .4), `+${won(h.o.price)} ${h.o.name}`);
  if (pendingHits.length > 3) {
    const rest = pendingHits.slice(3), sum = rest.reduce((s, h) => s + h.o.price, 0);
    pop(pendingHits[0].p.clone().setY(pendingHits[0].p.y + 1.2), `+${won(sum)} 외 ${rest.length}개`, true);
  }
  pendingHits.length = 0;
}
function korMoney(n) {
  n = Math.round(n);
  if (n < 10000) return n ? `${n.toLocaleString('ko-KR')}원` : '';
  const jo = Math.floor(n / 1e12), eok = Math.floor(n % 1e12 / 1e8), man = Math.floor(n % 1e8 / 1e4);
  let s = '';
  if (jo) s += `${jo.toLocaleString('ko-KR')}조 `;
  if (eok) s += `${eok.toLocaleString('ko-KR')}억 `;
  if (man && !jo) s += `${man.toLocaleString('ko-KR')}만 `;
  return `약 ${s.trim()} 원`;
}
const RANKS = [[0, '평화로운 오전 업무'], [3e5, '커피 쏟은 신입'], [3e6, '시말서 작성'], [3e7, '경위서 + 시말서'], [1.5e8, '징계위원회 회부'], [6e8, '권고사직'], [2e9, '손해배상 청구'], [8e9, '주가 하한가'], [3e10, '그룹 비상경영회의'], [1e11, '뉴스 속보 1면'], [3e11, '전설로 남은 퇴사자']];
let shownDmg = 0, rankI = 0;
function hud(rdt) {
  if (Math.abs(stats.damage - shownDmg) > .5) {
    shownDmg += (stats.damage - shownDmg) * Math.min(1, rdt * 5);
    if (Math.abs(stats.damage - shownDmg) < 1) shownDmg = stats.damage;
    $('#dmg').textContent = won(shownDmg);
    $('#dmgKor').textContent = korMoney(shownDmg);
  }
  let r = 0;
  while (r + 1 < RANKS.length && stats.damage >= RANKS[r + 1][0]) r++;
  if (r !== rankI) {
    if (r > rankI) toast(`📋 인사 발령: ${RANKS[r][1]}`);
    rankI = r; $('#rank').textContent = RANKS[r][1];
  }
  $('#objs').textContent = `${stats.hitObjs.toLocaleString('ko-KR')}개`;
  $('#pct').textContent = `${stats.total ? Math.min(100, stats.out / stats.total * 100).toFixed(1) : 0}%`;
  $('#fell').textContent = `${stats.fell.toLocaleString('ko-KR')}개`;
}

function resetAll() {
  for (const t of tasks) t.kill && t.kill();
  tasks.length = 0;
  for (const k in BK) { const bk = BK[k]; bk.mesh.count = 0; bk.bodies.length = 0; bk.dirtyM = bk.dirtyC = true; }
  bodies = []; OBJS = []; floors = [];
  deadCount = 0; rr = 0;
  for (const c of grid) c.length = 0;
  for (const c of sgrid) c.length = 0;
  later.length = 0; crush.length = 0; popQ.clear();
  Object.assign(stats, { damage: 0, total: 0, out: 0, hitObjs: 0, fell: 0 });
  pendingHits.length = 0;
  shownDmg = 0; rankI = 0; combo = 0;
  $('#dmg').textContent = '₩0'; $('#dmgKor').textContent = ''; $('#rank').textContent = RANKS[0][1];
  quake = null; slow = null; timeScale = 1; flashA = 0; dimTarget = 0; tint = 0; skipCine = false;
  for (const d of decals) d.m.visible = false;
  for (const f of [...fireballs, ...rings]) { f.t = f.d; f.m.visible = false; }
  for (const f of flashLights) { f.t = f.d; f.l.intensity = 0; }
  fire.clear(); smoke.clear();
  for (const p of pops) p.el.remove();
  pops.length = 0;
  buildWorld();
}

// ---------- 루프 ----------
const skyTintC = new THREE.Color(), orangeC = new THREE.Color(0xff8a3d);
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const rdt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (slow) {
    slow.t += rdt;
    if (slow.t < slow.hold) timeScale = slow.scale;
    else if (slow.t < slow.hold + slow.ramp) timeScale = slow.scale + (1 - slow.scale) * (slow.t - slow.hold) / slow.ramp;
    else { timeScale = 1; slow = null; }
  }
  const dt = rdt * timeScale;
  simT += dt;

  camera.position.sub(shakeOff);
  controls.update();

  for (let i = tasks.length - 1; i >= 0; i--) if (!tasks[i].update(rdt, dt)) tasks.splice(i, 1);
  updateQuake(dt);
  physics(dt);
  if (popQ.size) {
    const k = popQ.values().next().value;
    popQ.delete(k);
    if (totalCount() < SOFTCAP - 4000) populate(k);
  }
  fire.update(dt); smoke.update(dt);

  for (const f of fireballs) {
    if (f.t >= f.d) continue;
    f.t += dt;
    const k = Math.min(1, f.t / f.d);
    if (k >= 1) { f.m.visible = false; continue; }
    f.m.scale.setScalar(f.r * (.3 + .7 * (1 - Math.pow(1 - k, 3))));
    f.m.material.opacity = Math.pow(1 - k, 1.5) * .9;
    f.m.material.color.setRGB(1, .75 - .5 * k, .4 - .35 * k);
  }
  for (const f of rings) {
    if (f.t >= f.d) continue;
    f.t += dt;
    const k = Math.min(1, f.t / f.d);
    if (k >= 1) { f.m.visible = false; continue; }
    f.m.scale.setScalar(f.r * k + .1);
    f.m.material.opacity = (1 - k) * .6;
  }
  for (const f of flashLights) {
    if (f.t >= f.d) { f.l.intensity = 0; continue; }
    f.t += dt;
    f.l.intensity = f.i * Math.pow(Math.max(0, 1 - f.t / f.d), 2);
  }
  for (const d of decals) {
    if (!d.m.visible) continue;
    // 자국이 붙은 슬래브가 무너지면 자국도 지운다
    if (d.under && (!d.under.alive || d.under.dyn)) { d.m.visible = false; continue; }
    if (d.kind !== 'glow' || d.t > 3) continue;
    d.t += dt;
    const k = Math.min(1, d.t / 3);
    d.m.material.color.setRGB(3 + (.06 - 3) * k, 1.2 + (.05 - 1.2) * k, .35 + (.04 - .35) * k);
  }

  if (tint > 0) tint = Math.max(0, tint - rdt / 8);
  hemi.color.copy(baseHemi).lerp(orangeC, tint * .8);
  skyMat.color.copy(skyTintC.setRGB(1, 1 - .45 * tint, 1 - .7 * tint));
  flashA = Math.max(0, flashA - rdt / 2.4);
  $('#flash').style.opacity = flashA.toFixed(3);
  dimA += (dimTarget - dimA) * Math.min(1, rdt * 8);
  $('#dim').style.opacity = dimA.toFixed(3);

  for (const k in BK) {
    const bk = BK[k];
    if (bk.dirtyM) { bk.mesh.instanceMatrix.needsUpdate = true; bk.dirtyM = false; }
    if (bk.dirtyC) { bk.mesh.instanceColor.needsUpdate = true; bk.dirtyC = false; }
  }
  flushHits();

  shakeAmp *= Math.exp(-3.5 * rdt);
  if (shakeAmp < .002) shakeAmp = 0;
  shakeOff.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shakeAmp * .35 * Math.max(1, camera.position.distanceTo(controls.target) / 40));
  camera.position.add(shakeOff);

  renderer.render(scene, camera);

  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t += rdt;
    if (p.t > 1.4) { p.el.remove(); pops.splice(i, 1); continue; }
    _v.copy(p.p).project(camera);
    p.el.style.transform = `translate(${(_v.x + 1) / 2 * innerWidth}px, ${(1 - _v.y) / 2 * innerHeight}px)`;
    p.el.style.visibility = _v.z < 1 ? 'visible' : 'hidden';
  }
  hud(rdt);
  if (combo && now - lastAct > 3000) combo = 0;
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
addEventListener('resize', resize);
resize();

const touch = matchMedia('(hover: none)').matches;
$('#hint').textContent = touch
  ? '건물을 톡 눌러 부수면 그 층 사무실이 드러납니다 · 분홍 띠가 우리 회사 층 · 한 손가락: 회전 · 두 손가락: 이동·확대'
  : '건물을 부수면 그 층 사무실이 드러납니다 · 분홍 띠가 우리 회사 층(A 키로 이동) · 끌기: 회전 · 오른쪽 끌기: 이동 · 휠: 확대 · 1~6: 도구';
buildWorld();
requestAnimationFrame(tick);
</script>
